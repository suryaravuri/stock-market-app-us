              valueFrom:
                secretKeyRef:
                  key: '2'
                  name: stock-bootstrap-admin-password
            - name: BOOTSTRAP_ADMIN_EMAIL
              value: suryaravuri9@gmail.com
            image: us-central1-docker.pkg.dev/commanding-pier-324218/stock-app/backend:cloud-v9-paper
