            - name: AUTO_TRADING_ENABLED
              value: 'false'
            - name: ALPACA_DATA_FEED
              value: iex
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: '2'
                  name: stock-db-password
            - name: ALPACA_API_KEY
